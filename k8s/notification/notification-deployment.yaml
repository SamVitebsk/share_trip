apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: sharetrip
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
        - name: notification
          image: sharetrip/notification:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: notification-config
            - secretRef:
                name: notification-secret